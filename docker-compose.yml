
volumes:
  minio-data:

services:
  backend:
    image: artisera-backend/backend
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:4000"
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./backend:/code
      - ./backend/uploads:/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio-client:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 949M

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'mc ready local 2>/dev/null || wget -q --spider http://localhost:9000/minio/health/live'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 949M

  minio-client:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set local http://minio:9000 minio minio123; do
          echo "Waiting for MinIO to become available..."
          sleep 2
        done

        /usr/bin/mc mb --ignore-existing local/artisera || exit 1

        /usr/bin/mc anonymous set public local/artisera || exit 1

        echo "MinIO bucket artisera is ready with public access."
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M

  celery:
    image: artisera-backend/backend
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    command: celery -A backend worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/code
      - ./backend/uploads:/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 512M
